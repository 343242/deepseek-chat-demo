# ============================================================================
# CNB（腾讯云原生构建）流水线配置 — Pipeline as Code
# 官方文档：https://docs.cnb.cool/zh/build/
#
# 触发与行为：
#   main 分支 push      → 单元测试 + 构建镜像 + 推送制品（latest / main / 短SHA）
#   main 分支 PR        → 单元测试门禁（不产出镜像）
#   v* 标签（如 v1.0.0）→ 单元测试 + 构建镜像 + 推送制品（latest / v1.0.0 / 短SHA）
#
# 制品地址：docker.cnb.cool/${CNB_REPO_SLUG_LOWERCASE}:<tag>
# 服务器部署：
#   docker login docker.cnb.cool -u cnb -p <访问令牌>          # 一次性
#   docker pull docker.cnb.cool/<仓库路径>:latest
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================================

# ── 复用块（YAML 锚点，官方支持：docs.cnb.cool/zh/build/simplify-configuration）─
# 构建环境：JDK 21 + Maven + Docker CLI，由 sandbox/Dockerfile.cnb-build 动态构建
.build-env: &build-env
  services:
    - docker                                    # DinD：提供 docker daemon
  docker:
    build:
      dockerfile: sandbox/Dockerfile.cnb-build
    volumes:
      - main:/root/.m2:copy-on-write            # Maven 依赖缓存（跨构建复用，并发安全）
  env:
    DOCKER_BUILDKIT: "1"                        # Dockerfile 的 --mount=type=cache 依赖 BuildKit

# 单元测试阶段（mvnw test 只运行 *Test，*IT 集成测试默认不触发）
.test-stage: &test-stage
  - name: run unit tests
    script: ./mvnw -B test

# 构建 + 推送阶段：latest / 短提交SHA / 分支或标签名 三个标签
.build-push-stages: &build-push-stages
  - name: run unit tests
    script: ./mvnw -B test
  - name: build docker image
    script: |
      docker build \
        -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT} \
        -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH} \
        -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest \
        .
  - name: push docker image
    script: |
      # 显式登录：CNB 内置临时令牌（可信事件含制品读写权限）。
      # 注意：每个 stage 是独立容器，login 必须与 push 同 stage，否则凭据丢失
      docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
      docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}
      docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH}
      docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest

# ── main 分支 ──────────────────────────────────────────────────────────────
main:
  push:
    - name: test-build-push
      <<: *build-env
      runner:
        cpus: 4                                 # 内存 = CPU × 2GiB；按量计费，可按需调低
      stages: *build-push-stages

  pull_request:
    - name: pr-tests
      <<: *build-env
      docker:
        build:
          dockerfile: sandbox/Dockerfile.cnb-build
        volumes:
          - main:/root/.m2:copy-on-write-read-only   # PR 并发场景缓存只读复用，不写回
      stages: *test-stage

# ── v 开头版本标签（如 v1.0.0）──────────────────────────────────────────────
v*:
  tag_push:
    - name: release-image
      <<: *build-env
      runner:
        cpus: 4
      stages: *build-push-stages
