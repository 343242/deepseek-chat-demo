# Smart RAG — 2核4G 低配服务器覆盖配置
# ============================================================================
# 用法（prod 文件在前，本文件在后，合并解析且本文件优先生效）：
#   docker compose -f docker-compose.prod.yml -f docker-compose.2c4g.yml up -d
#   docker compose -f docker-compose.prod.yml -f docker-compose.2c4g.yml pull app
#
# 前提（4G 物理内存必须做）：
#   1. 加 2G swap 兜底防 OOM：
#        fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
#   2. 磁盘留 ≥20GB（MinIO + PG + Redis AOF + 日志）
#
# 变更摘要（对比 prod 版）：
#   app          内存上限 2.5G → 1.5G（JVM 自动感知 cgroup，heap ≈ 1.1G）；镜像改为从 CNB 制品库拉取
#   redis        maxmemory 256M → 128M
#   postgres/minio/nginx/certbot 保持默认（PG 默认 shared_buffers=128MB 已合适）
# ============================================================================

services:
  # ── 应用 ────────────────────────────────────────────────────────────────
  app:
    # 镜像已由 CNB 流水线发布：docker.cnb.cool/firsttestcloud/smart-rag:<tag>
    # 生产建议固定短 SHA 标签（如 :a1b2c3d4）而非 latest，便于回滚
    image: docker.cnb.cool/firsttestcloud/smart-rag:latest
    build: !reset null                        # 移除 prod 的本地构建，改为纯拉取
    mem_limit: 1536m                          # 2560m → 1536m
    mem_reservation: 1024m                    # 2048m → 1024m

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    command: >
      sh -c 'redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD"
      --maxmemory 128mb
      --maxmemory-policy noeviction'
