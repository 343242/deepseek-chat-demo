# Smart RAG — 单机全栈生产部署编排
# ============================================================================
# 用法（详见 README.md 「生产部署」章节）：
#   1. cp .env.example .env  并填入实际密钥 / 域名
#   2. 首次部署：./scripts/init-ssl.sh（申请 Let's Encrypt 证书）
#   3. 启动：  docker compose -f docker-compose.prod.yml up -d
#   4. 更新：  docker compose -f docker-compose.prod.yml up -d --build app
#
# 网络拓扑：
#   - 仅 nginx 暴露 80/443 到公网
#   - 中间件（PG/Redis/MinIO）只在内部网络 smart-rag-net，公网不可达
#   - app 通过 service 名访问中间件（DB_HOST=postgres, REDIS_HOST=redis ...）
# ============================================================================

services:
  # ── 应用 ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-rag-app
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: stable,prod
      # 容器内通过 service 名访问同网络中间件（覆盖 .env 里的 localhost 默认值）
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:   { condition: service_healthy }
      redis:      { condition: service_healthy }
      minio:      { condition: service_healthy }
    volumes:
      # 应用日志（log4j2.xml 输出到 /app/logs/，按级别分文件）
      - ./logs:/app/logs
    networks:
      - smart-rag-net
    mem_limit: 2560m
    mem_reservation: 2048m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s   # Flyway 迁移 + PgVectorStore 建表 + RedisStream subscribe，冷启给足时间
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── 反向代理 ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: smart-rag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # nginx 官方镜像自带的 envsubst 机制会自动把 /etc/nginx/templates/*.template
    # 渲染成 /etc/nginx/conf.d/*.conf，$$ 转义可保留 nginx 原生变量
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME required}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      # 证书存储与 scripts/init-ssl.sh 保持一致（该脚本将证书写入 ./certbot/）
      # 若用命名卷，init-ssl.sh 申请的证书对 nginx/certbot 容器不可见，首次部署会因缺证书崩溃
      - ./certbot/etc:/etc/letsencrypt:ro
      - ./certbot/var:/var/lib/letsencrypt
      - ./certbot/webroot:/var/www/certbot:ro
    depends_on:
      app: { condition: service_healthy }
    networks:
      - smart-rag-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── 证书续期守护 ──────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: smart-rag-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/lib/letsencrypt
      - ./certbot/webroot:/var/www/certbot
    # 每 12 小时尝试续期一次（Let's Encrypt 证书 90 天有效，到期前 30 天才会真正续）
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet --webroot --webroot-path /var/www/certbot; sleep 12h; done"]
    networks:
      - smart-rag-net

  # ── 中间件（端口仅内部网络，不映射到宿主机） ──────────────────────────
  postgres:
    build: ./docker/postgres
    container_name: smart-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_rag}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_rag}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - smart-rag-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:8.2.6-bookworm
    container_name: smart-rag-redis
    restart: unless-stopped
    # MQ 持久化策略（parent 验收）：AOF everysec + noeviction——
    # stream 是消息总线载体，不能被 LRU 驱逐（驱逐 = 消息丢失）；内存写满时 Redis 拒绝写入，
    # send 失败由 outbox 行吸收（relay 补投），见 docs/design/messaging-migration.md
    command: >
      sh -c 'redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD"
      --maxmemory 256mb
      --maxmemory-policy noeviction'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - smart-rag-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: pgsty/minio:latest
    container_name: smart-rag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - smart-rag-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smart-rag-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
