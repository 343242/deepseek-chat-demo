# Smart RAG Docker Compose
# 用法: docker compose up -d

services:
  postgres:
    build: ./docker/postgres
    container_name: smart-rag-db
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      # schema.sql 已废弃，改由 Flyway (db/migration/) 管理数据库迁移
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2.6-bookworm
    container_name: smart-rag-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # MQ 持久化策略（parent 验收）：AOF everysec + noeviction——
    # stream 是消息总线载体，不能被 LRU 驱逐（驱逐 = 消息丢失）；内存写满时 Redis 拒绝写入，
    # send 失败由 outbox 行吸收（relay 补投），见 docs/design/messaging-migration.md
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/minio:latest
    container_name: smart-rag-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # 浏览器直传 MinIO 的 CORS 白名单（服务级全局，本镜像 bucket 级 CORS API 501 不可用）。
      # dev 缺省 * 开箱即用；生产 compose 变体不提供 :-* 缺省（fail-closed 由部署层承担），
      # 白名单须与后端 CORS_ALLOWED_ORIGINS 同源维护（见 docs/design/presigned-direct-upload.md）
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
