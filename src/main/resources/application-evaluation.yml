# RAG 评估系统专用配置
# 仅在激活 evaluation profile 时加载: spring.profiles.active=dev,evaluation

app:
  # 评估模块前置条件：KG 测试集生成的实体单一来源是实体中心索引层（rag_chunk_entity），
  # 语料需在实体层开启后（重新）导入，不写兜底与回填
  rag:
    entity:
      enabled: true
  evaluation:
    enabled: true
    # 抽取模型候选 ID（主题抽取、persona 匹配、概念组合；便宜模型）
    generation-model: deepseek-v4-flash
    test-user-id: 1
    dataset:
      # 目标测试集条数（ragas 式生成）
      size: 50
      # 参与知识图谱构建的最大 chunk 数（随机采样）
      max-chunks: 200
      # 出题主模型候选 ID（问题与参考答案生成；强模型）。留空用默认 chat 候选
      synthesis-model: qwen3.8-max
      # 向量余弦相似边阈值（chunk 现成向量；对照 Python 参照实现校准）
      cosine-threshold: 0.7
      # 固定中文 persona（不 LLM 生成）；缺省内置 4 个，可按业务覆盖
      # personas:
      #   - name: 企业新员工
      #     role-description: 刚入职的员工，对公司制度流程不熟悉
    runner:
      default-k: 10
      concurrency: 2
      # 信号量获取超时（秒）：并发 run 数达上限时，新 run 等待获取信号量的最长时间
      acquire-timeout-seconds: 60
      # 单条 item 的 ScopedTasks 作用域超时（秒）；LLM 调用级超时在 llm 模块配置
      item-timeout-seconds: 300
      # run 被判定为 stale 的阈值（分钟）：超时仍 running 的 run/gen_run 被 sweeper 标记 FAILED
      stale-run-minutes: 30
      # 同时执行的最大 run 数（虚拟线程 unlimited，靠此 Semaphore 限并发，防打爆 LLM API）
      max-concurrent-runs: 2
    # Judge 候选 ID，对应 app.llm.capabilities.chat.candidates[].id；留空则用默认 chat 候选
    # 建议 Judge 与 generation-model 选不同候选，避免自评偏差
    judge:
      candidate-id: qwen3-max
