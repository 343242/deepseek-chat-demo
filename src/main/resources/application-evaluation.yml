# RAG 评估系统专用配置
# 仅在激活 evaluation profile 时加载: spring.profiles.active=dev,evaluation

app:
  evaluation:
    enabled: true
    generation-model: deepseek/deepseek-v4-pro
    test-user-id: 1
    dataset:
      sample-size: 50
      questions-per-chunk: 2
    runner:
      default-k: 10
      concurrency: 1
      timeout-seconds: 300
    # Judge 模型独立配置（不走 Provider 路由）
    judge:
      model: glm-5.1
      base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      api-key: ${ZHIPU_API_KEY:76252e35a4724fc8978f63762d101209.Ff1tofbmCQHV4LkD}
