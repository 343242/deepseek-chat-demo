server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:smart_rag}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-chat
        temperature: 0.7
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400}
    issuer: smart-rag
    redis-prefix: "auth:token:"
  snowflake:
    epoch: ${SNOWFLAKE_EPOCH:2026-01-01T00:00:00+08:00}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:0}
    worker-id: ${SNOWFLAKE_WORKER_ID:0}

  # ETL 线程池 + 快速通道配置
  etl:
    executor:
      io:
        core-pool-size: 8
        max-pool-size: 16
        queue-capacity: 100
        thread-name-prefix: "etl-io-"
        keep-alive-seconds: 60
      cpu:
        core-pool-size: 4
        max-pool-size: 8
        queue-capacity: 50
        thread-name-prefix: "etl-cpu-"
        keep-alive-seconds: 60
      merge:
        core-pool-size: 4
        max-pool-size: 8
        queue-capacity: 50
        thread-name-prefix: "merge-"
        keep-alive-seconds: 120
      search:
        core-pool-size: 4
        max-pool-size: 8
        queue-capacity: 50
        thread-name-prefix: "rag-search-"
        keep-alive-seconds: 60

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.demo.chat: INFO
