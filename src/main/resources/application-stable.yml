server:
  port: 8080
  # 信任反代 X-Forwarded-*，使 getRemoteAddr() 返回真实客户端 IP（登录/验证码限流与审计准确）；
  # 仅在部署于受信反向代理（nginx/ALB）后启用，否则客户端可伪造 IP
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:smart_rag}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: true
    clean-disabled: true
  redis:
    redisson:
      config: |
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          password: "${REDIS_PASSWORD}"
          connectionPoolSize: 16
          connectionMinimumIdleSize: 4
          timeout: 3000
          retryAttempts: 2
          retryInterval: 500
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        table-name: vector_store
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400}
    issuer: smart-rag
    redis-prefix: "auth:token:"
    cookie-secure: true   # 生产环境 Cookie 必须 Secure（防 HTTP 降级截获 token）；dev/evaluation 保持 false
  snowflake:
    epoch: ${SNOWFLAKE_EPOCH:2026-01-01T00:00:00+08:00}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:0}
    worker-id: ${SNOWFLAKE_WORKER_ID:0}

  # LLM 统一 SPI 配置
  llm:
    providers:
      bailian:
        url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${DASHSCOPE_API_KEY}
        endpoints:
          chat: /chat/completions
      deepseek:
        url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY}
        endpoints:
          chat: /chat/completions
      zhipu:
        url: https://open.bigmodel.cn/api/paas/v4
        api-key: ${ZHIPU_API_KEY}
        endpoints:
          chat: /chat/completions
      minimax:
        url: https://api.minimaxi.com/v1
        api-key: ${MINIMAX_API_KEY}
        endpoints:
          chat: /v1/text/chatcompletion_v2
    capabilities:
      chat:
        default-model: qwen3-max
        deep-thinking-model: qwen3-max
        candidates:
          - id: qwen-plus
            provider: bailian
            model: qwen-plus-latest
            priority: 1
          - id: deepseek-v4-flash
            provider: deepseek
            model: deepseek-v4-flash
            supports-streaming: true
            priority: 2
          - id: qwen3-max
            provider: bailian
            model: qwen3-max
            supports-thinking: true
            priority: 4
      embedding:
        default-model: qwen-emb-8b
        candidates:
          - id: qwen-emb-8b
            provider: bailian
            model: Qwen/Qwen3-Embedding-8B
            dimension: 1024
            priority: 1
      reranking:
        default-model: qwen3-rerank
        candidates:
          - id: qwen3-rerank
            provider: bailian
            model: qwen3-rerank
            priority: 1
    resilience:
      retry:
        max-attempts: 3
        base-delay-ms: 500
        max-delay-ms: 5000
        multiplier: 2.0
      circuit-breaker:
        failure-threshold: 5
        open-duration-ms: 30000
        half-open-max-calls: 2
      probe:
        probe-timeout-ms: 3000
        enabled: true

  # ETL 线程池 + 快速通道配置
  etl:
    executor:
      io:
        core-pool-size: 8
        max-pool-size: 16
        queue-capacity: 100
        thread-name-prefix: "etl-io-"
        keep-alive-seconds: 60
      cpu:
        core-pool-size: 4
        max-pool-size: 8
        queue-capacity: 50
        thread-name-prefix: "etl-cpu-"
        keep-alive-seconds: 60
      merge:
        core-pool-size: 4
        max-pool-size: 8
        queue-capacity: 50
        thread-name-prefix: "merge-"
        keep-alive-seconds: 120

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.demo.chat: INFO
