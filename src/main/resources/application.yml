server:
  port: 8080
  # 信任反代 X-Forwarded-*，使 getRemoteAddr() 返回真实客户端 IP（限流/审计准确）；
  # 仅在受信反向代理（nginx/ALB）后部署时语义成立，直连时头可伪造但不影响功能
  forward-headers-strategy: framework
  # 优雅停机：SIGTERM 时不立即关 socket，让 in-flight 请求处理完；
  # 与 app.messaging.shutdown-timeout（Redis consumer）+ log4j2 shutdownHook=disable 构成完整链路
  shutdown: graceful

spring:
  lifecycle:
    # 优雅停机最长等待 30s（覆盖典型 SSE 长会话 tail；超时强制关闭）
    timeout-per-shutdown-phase: 30s
  datasource:
    # socketTimeout 须大于全局语句超时 300s（见文末 mybatis-plus）：语句先被 MyBatis 干净取消，
    # socket 超时仅兜底挂死连接；tcpKeepAlive 防空闲连接被中间设备静默掐断
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:smart_rag}?socketTimeout=${DB_SOCKET_TIMEOUT:360}&tcpKeepAlive=true
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: true
    clean-disabled: true
  redis:
    redisson:
      # 生产需 env 提供 REDIS_PASSWORD；dev profile 整块覆盖此字符串（本地无密码）
      config: |
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          password: "${REDIS_PASSWORD}"
          connectionPoolSize: 16
          connectionMinimumIdleSize: 4
          timeout: 3000
          retryAttempts: 2
          retryInterval: 500
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  servlet:
    multipart:
      # 205MB = 批量上传业务上限 200MB + multipart 边界开销；单文件上限由 max-file-size 独立约束
      max-request-size: 205MB
      max-file-size: 55MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    mcp:
      client:
        # SDK 自动初始化保持关闭；连接由 DB 驱动的 MCP bootstrap 逐 Server 隔离初始化。
        initialized: ${MCP_INITIALIZED:false}
        type: SYNC
        request-timeout: ${MCP_REQUEST_TIMEOUT:30s}
        # Tavily 远程 MCP。Bearer Token 由 Admin API 加密注入 header（不走 URL query——
        # SDK OAuth 协商会盖过 query param）；未入库工具默认拒绝
        streamable-http:
          connections:
            tavily:
              url: https://mcp.tavily.com/mcp
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # 须与 db/migration V27 后的列定义 vector(1536) 一致；上限受 pgvector HNSW 2000 维约束
        dimensions: 1536
        initialize-schema: true
        table-name: vector_store
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

app:
  # 展示时区——JVM TZ 与 API 输出展示时区从同一环境变量派生，保持一致
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  date-format: yyyy-MM-dd HH:mm:ss
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ratelimit:
    login:
      limit: 30        # 30 次 / 30 分钟
      ttl-sec: 1800
    register:
      limit: 10        # 10 次 / 20 分钟（注册攻击面更大，阈值更紧）
      ttl-sec: 1200
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400}
    issuer: smart-rag
    redis-prefix: "auth:token:"
    # 生产 Cookie 必须 Secure（防 HTTP 降级截获 token）；dev 在 profile 中显式 false
    cookie-secure: true
    # SameSite 默认 Lax 适配同源/反代部署；前后端跨域部署改 None（后端另有强制校验兜底）
    cookie-same-site: ${JWT_COOKIE_SAMESITE:Lax}
  snowflake:
    epoch: ${SNOWFLAKE_EPOCH:2026-01-01T00:00:00+08:00}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:0}
    worker-id: ${SNOWFLAKE_WORKER_ID:0}
  sse:
    # 文档状态流空闲收尾宽限期；在途文档豁免（emitter 10 分钟超时为兜底上限）
    document-idle-grace-ms: ${SSE_DOC_IDLE_GRACE_MS:60000}
  upload:
    direct:
      # presigned URL 有效期（秒）：过期前端重走 part-urls 签发，无状态成本
      presign-expiry: 600s
      # direct init 独立限流（次/分/用户）：每文件一次 init，需高于旧 chunk 会话 10/分
      init-rate-limit-per-minute: 30
  etl:
    consumer:
      # topic 必须与 app.messaging.ordered-topics 白名单一致（OutboxRelay 有序投递依赖）
      topic: ${ETL_CONSUMER_TOPIC:rag_index_document}
      group: ${ETL_CONSUMER_GROUP:index-group}
      batch-size: ${ETL_CONSUMER_BATCH_SIZE:5}
      invisible-duration: ${ETL_CONSUMER_INVISIBLE_DURATION:30m}
    image:
      consumer:
        # 图片提取触发消息（design §6.9）。注意：rag_extract_images 刻意【不】纳入
        # messaging.ordered-topics 白名单——该白名单是声明式纪律非运行时机制，且总线
        # 不分区、投递序不构成消费序；同 documentId 的实际串行由 image:lock:{id} +
        # 行级条件更新保证，不纳入换取 relay 并行投递吞吐。
        topic: ${ETL_IMAGE_CONSUMER_TOPIC:rag_extract_images}
        group: ${ETL_IMAGE_CONSUMER_GROUP:image-group}
        batch-size: 1          # 逐条消费：消息仅是触发器（manifest 在 DB），批语义无收益
        # 调大 invisible-duration >30m 须同步上调 MESSAGING_PEL_MIN_IDLE_MS（§6.9 v1.7 中-1：
        # PEL 回收阈值是 pel-min-idle 默认 40min，不感知本覆写；否则 XAUTOCLAIM 会抢走
        # 仍在处理的长消息）
        invisible-duration: ${ETL_IMAGE_INVISIBLE_DURATION:30m}
    # 线程池生产级容量；dev 在 profile 中缩容
    executor:
      io:
        core-pool-size: 8
        max-pool-size: 16
        queue-capacity: 100
        thread-name-prefix: "etl-io-"
        keep-alive-seconds: 60
      cpu:
        core-pool-size: 4
        max-pool-size: 8
        queue-capacity: 50
        thread-name-prefix: "etl-cpu-"
        keep-alive-seconds: 60
      merge:
        core-pool-size: 4
        max-pool-size: 8
        queue-capacity: 50
        thread-name-prefix: "merge-"
        keep-alive-seconds: 120
  chat:
    memory:
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}
  rag:
    fts-config: ${RAG_FTS_CONFIG:jiebacfg}
    entity:
      embedding-batch-size: ${RAG_ENTITY_EMBEDDING_BATCH_SIZE:20}
      # 与 bailian 同步接口单请求行数上限（20）对齐
      description-max-length: ${RAG_ENTITY_DESCRIPTION_MAX_LENGTH:500}
      # 实体管线 LLM 调用并发上限（chunk 抽取/描述压缩/embedding 批次），约束提供商 QPM 配额；
      # 经 TaskScope maxConcurrency 限流，虚拟线程不池化（JEP 444）
      llm-concurrency: ${RAG_ENTITY_LLM_CONCURRENCY:32}
      # === Path C 在线检索 ===
      match-threshold: ${RAG_ENTITY_MATCH_THRESHOLD:0.85}
      frontier-budget: ${RAG_ENTITY_FRONTIER_BUDGET:50}
      chunk-top-k: ${RAG_ENTITY_CHUNK_TOP_K:20}
      expand-chunk-top-k: ${RAG_ENTITY_EXPAND_CHUNK_TOP_K:10}
      expansion-hops: ${RAG_ENTITY_EXPANSION_HOPS:1}
      expansion-decay: ${RAG_ENTITY_EXPANSION_DECAY:0.7}
      alpha: ${RAG_ENTITY_ALPHA:0.5}
      beta: ${RAG_ENTITY_BETA:0.3}
      gamma: ${RAG_ENTITY_GAMMA:0.2}
      weak-tie-enabled: ${RAG_ENTITY_WEAK_TIE_ENABLED:true}
      extraction-model: ${RAG_ENTITY_EXTRACTION_MODEL:}
      community-detection-enabled: ${RAG_ENTITY_COMMUNITY_DETECTION_ENABLED:true}
      # === V30 共现图增量维护（docs/design/incremental-cooccurrence-maintenance.md）===
      lock-timeout-millis: ${RAG_ENTITY_LOCK_TIMEOUT_MILLIS:10000}
      # 重试退避 1s/2s/4s × jitter，仅 40P01/40001/55P03
      lock-retry-attempts: ${RAG_ENTITY_LOCK_RETRY_ATTEMPTS:3}
      # 同 scope 写闸门等待上限；排队不占 DB 连接，超时走次日重链接
      write-gate-wait-millis: ${RAG_ENTITY_WRITE_GATE_WAIT_MILLIS:120000}
      # derive 防抖窗口：批量文档合并为窗口末尾一次 derive；0 = 关闭（逐文档即时）
      derive-debounce-millis: ${RAG_ENTITY_DERIVE_DEBOUNCE_MILLIS:30000}
      reconcile:
        enabled: ${RAG_ENTITY_RECONCILE_ENABLED:true}
        cron: ${RAG_ENTITY_RECONCILE_CRON:0 0 8 * * *}
        # 每周强制 derive 日（旁路指纹门控），默认周一
        force-derive-day: ${RAG_ENTITY_RECONCILE_FORCE_DERIVE_DAY:MONDAY}
        # 每日重链接重抽上限（全量重建限流；0 = 不限）
        relink-limit: ${RAG_ENTITY_RECONCILE_RELINK_LIMIT:0}
  # 评估模块（接口权限 evaluation:manage）
  evaluation:
    # 抽取用便宜模型候选（主题抽取/persona 匹配/概念组合）
    generation-model: deepseek-v4-flash
    test-user-id: ${EVALUATION_TEST_USER_ID:1}
    dataset:
      # 目标测试集条数
      size: ${EVALUATION_DATASET_SIZE:50}
      # 参与知识图谱构建的最大 chunk 数（随机采样）
      max-chunks: ${EVALUATION_DATASET_MAX_CHUNKS:200}
      # 出题主模型候选（强模型）；留空用默认 chat 候选
      synthesis-model: qwen3.8-max
      # 摘要向量余弦相似边阈值（ragas prechunked 默认 0.7）
      cosine-threshold: 0.7
      # personas 列表；为空时自动生成 num-personas 个
      num-personas: 3
      node-filter:
        # 问题潜力过滤：评分 ≤ min-score 的 chunk 剔除
        min-score: 2
      # 生成任务并发（独立于 runner.max-concurrent-runs，不占评估并发额度）
      max-concurrent-jobs: 2
    metrics:
      # beta<1 偏精度（重罚幻觉），>1 偏召回（重罚遗漏）；权重为 ragas 默认
      answer-correctness:
        factuality-weight: 0.75
        similarity-weight: 0.25
        beta: 1.0
      # precision | recall | f1（ragas 默认 f1）
      factual-correctness:
        mode: f1
        beta: 1.0
      # relevant（ragas 默认）| irrelevant
      noise-sensitivity:
        mode: relevant
      # 反向问题独立采样次数（ragas strictness 默认 3）
      answer-relevancy:
        strictness: 3
    runner:
      default-k: 10
      concurrency: 2
      # 并发 run 达上限时新 run 等待信号量的最长时间（秒）
      acquire-timeout-seconds: 60
      # 单条 item 作用域超时（秒）；LLM 调用级超时在 llm 模块配置
      item-timeout-seconds: 300
      # 超时仍 running 的 run 被 sweeper 标记 FAILED（分钟）
      stale-run-minutes: 30
      # 最大并发 run 数（虚拟线程靠此 Semaphore 限流，防打爆 LLM API）
      max-concurrent-runs: 2
    # Judge 候选 ID（app.llm.capabilities.chat.candidates[].id）；留空回退默认 chat 候选。
    # 建议与 generation-model 选不同候选避免自评偏差；未声明候选会 fail-fast 阻断启动
    judge:
      candidate-id: ${EVALUATION_JUDGE_CANDIDATE_ID:}
  cag:
    enabled: ${CAG_ENABLED:true}
    inject-prompt: ${CAG_INJECT_PROMPT:true}
    log-context: ${CAG_LOG_CONTEXT:true}
    model-params-cache-ttl-seconds: ${MODEL_PARAMS_CACHE_TTL_SECONDS:30}
    model-params-cache-max-size: ${MODEL_PARAMS_CACHE_MAX_SIZE:200}
    system-prompt-cache-ttl-minutes: ${SYSTEM_PROMPT_CACHE_TTL_MINUTES:5}
    system-prompt-cache-max-size: ${SYSTEM_PROMPT_CACHE_MAX_SIZE:200}
  agent:
    enabled: ${AGENT_ENABLED:true}
    intent-model: ${AGENT_INTENT_MODEL:deepseek-v4-flash}
    intent-temperature: ${AGENT_INTENT_TEMPERATURE:0.1}
    intent-retries: ${AGENT_INTENT_RETRIES:2}
    intent-timeout-ms: ${AGENT_INTENT_TIMEOUT_MS:5000}
    max-tool-iterations: ${AGENT_MAX_TOOL_ITERATIONS:10}
    max-consecutive-same-tool: ${AGENT_MAX_CONSECUTIVE_SAME_TOOL:3}
    context-window-ratio: ${AGENT_CONTEXT_WINDOW_RATIO:0.8}
    tool-timeout-ms: ${AGENT_TOOL_TIMEOUT_MS:10000}
    degrade-on-failure: ${AGENT_DEGRADE_ON_FAILURE:true}
    # ReAct 增强 prompt 在 classpath:static/prompt/agent/*.xml（AgentPromptLoader 加载）
  sandbox:
    enabled: ${SANDBOX_ENABLED:true}
    max-concurrency: ${SANDBOX_MAX_CONCURRENCY:3}
    timeout: ${SANDBOX_TIMEOUT:10s}
    max-memory-mb: ${SANDBOX_MAX_MEMORY_MB:128}
    max-cpus: ${SANDBOX_MAX_CPUS:1.0}
    max-output-bytes: ${SANDBOX_MAX_OUTPUT_BYTES:10240}
    language-images:
      PYTHON: sandbox-python:bookworm
      JAVASCRIPT: sandbox-node:bookworm
      TYPESCRIPT: sandbox-node:bookworm
      JAVA: sandbox-java:bookworm
  messaging:
    topic-prefix: ${MESSAGING_TOPIC_PREFIX:SMART_RAG_}
    shutdown-timeout: ${MESSAGING_SHUTDOWN_TIMEOUT:30s}
    ordered-topics:
      - rag_index_document
    idempotent:
      enabled: ${MESSAGING_IDEMPOTENT_ENABLED:true}
      ttl-seconds: ${MESSAGING_IDEMPOTENT_TTL_SECONDS:90000}
    circuit-breaker:
      failure-threshold: ${MESSAGING_CB_FAILURE_THRESHOLD:5}
      cooldown-millis: ${MESSAGING_CB_COOLDOWN_MILLIS:30000}
    # 共享退避表（16 级；消费端重试 + OutboxRelay 共用）
    backoff-ms: [1000, 5000, 10000, 30000, 60000, 120000, 180000, 240000,
                 300000, 360000, 420000, 480000, 540000, 600000, 1200000, 1800000]
    redis:
      stream-prefix: ${MESSAGING_STREAM_PREFIX:stream:}
      dlq-prefix: ${MESSAGING_DLQ_PREFIX:dlq:}
      retry-prefix: ${MESSAGING_RETRY_PREFIX:retry:}
      retry-zset-prefix: ${MESSAGING_RETRY_ZSET_PREFIX:retry-zset:}
      consumer-name-prefix: ${MESSAGING_CONSUMER_NAME_PREFIX:app:}
      # 仅作 lag 告警阈值；物理裁剪由 StreamTrimTask MINID 执行
      trim-threshold: ${MESSAGING_TRIM_THRESHOLD:100000}
      # DLQ 审计保留上限（MAXLEN）
      dlq-trim-threshold: ${MESSAGING_DLQ_TRIM_THRESHOLD:50000}
      read-block-ms: ${MESSAGING_READ_BLOCK_MS:2000}
      read-batch: ${MESSAGING_READ_BATCH:32}
      # 40min > ETL invisibleDuration 30min + 10min margin（启动期断言）
      pel-min-idle-ms: ${MESSAGING_PEL_MIN_IDLE_MS:2400000}
      retry-poll-interval: ${MESSAGING_RETRY_POLL_INTERVAL:5s}
      trim-poll-interval: ${MESSAGING_TRIM_POLL_INTERVAL:60s}
      max-attempts: ${MESSAGING_MAX_ATTEMPTS:16}
      # retry hash TTL（覆盖最大退避窗口 ×2）
      retry-hash-ttl: ${MESSAGING_RETRY_HASH_TTL:2h}
      # pollLoop 指数退避重连（jitter 防同步重连风暴）
      reconnect-backoff:
        initial-ms: ${MESSAGING_RECONNECT_INITIAL_MS:1000}
        multiplier: ${MESSAGING_RECONNECT_MULTIPLIER:2.0}
        max-ms: ${MESSAGING_RECONNECT_MAX_MS:30000}
        jitter-factor: ${MESSAGING_RECONNECT_JITTER_FACTOR:0.2}
      # XREADGROUP BLOCK 走独立连接池，不占业务共享 Redis 连接
      consumer:
        connection:
          share-native-connection: false
          pool:
            max-active: ${MESSAGING_CONSUMER_POOL_MAX_ACTIVE:32}
            max-idle: ${MESSAGING_CONSUMER_POOL_MAX_IDLE:32}
    # Publisher outbox——DB 事务级最终一致投递
    outbox:
      enabled: ${MESSAGING_OUTBOX_ENABLED:true}
      poll-interval: ${MESSAGING_OUTBOX_POLL_INTERVAL:5s}
      batch-size: ${MESSAGING_OUTBOX_BATCH_SIZE:32}
      # 单 poll 内 claim 批数上限（防饿死）
      max-batches-per-poll: ${MESSAGING_OUTBOX_MAX_BATCHES_PER_POLL:10}
      # 与消费端重试窗口独立；gate OPEN 时冻结
      max-attempts: ${MESSAGING_OUTBOX_MAX_ATTEMPTS:16}
      immediate-retry-count: ${MESSAGING_OUTBOX_IMMEDIATE_RETRY_COUNT:2}
      immediate-retry-interval-ms: ${MESSAGING_OUTBOX_IMMEDIATE_RETRY_INTERVAL_MS:100}
      # 即时投递有界 executor（拒绝 = 行留 relay，天然不丢）
      immediate-executor-core: ${MESSAGING_OUTBOX_IMMEDIATE_EXECUTOR_CORE:2}
      immediate-executor-max: ${MESSAGING_OUTBOX_IMMEDIATE_EXECUTOR_MAX:8}
      immediate-executor-queue: ${MESSAGING_OUTBOX_IMMEDIATE_EXECUTOR_QUEUE:64}
      dead-retention-days: ${MESSAGING_OUTBOX_DEAD_RETENTION_DAYS:7}
      cleanup-cron: ${MESSAGING_OUTBOX_CLEANUP_CRON:0 0 4 * * *}
      leader-lock-key: ${MESSAGING_OUTBOX_LEADER_LOCK_KEY:outbox:relay:leader}
      cb-signal-prefix: ${MESSAGING_OUTBOX_CB_SIGNAL_PREFIX:messaging:cb:}
      # isOpen() 本地缓存 TTL（热路径省 Redis RTT）
      cb-local-cache-ttl-ms: ${MESSAGING_OUTBOX_CB_LOCAL_CACHE_TTL_MS:2000}
      # claiming 行超时回收阈值（绑定 claimPending SQL 参数）
      claiming-timeout-seconds: ${MESSAGING_OUTBOX_CLAIMING_TIMEOUT_SECONDS:300}
      # gate OPEN 时顺延 next_retry_at（冻结 attempts）
      gate-defer-interval: ${MESSAGING_OUTBOX_GATE_DEFER_INTERVAL:5s}
  llm:
    providers:
      bailian:
        # 专属 maas 实例（业务空间专属域名 *.maas.aliyuncs.com），SDK 原生路由守卫命中，chat 候选实走 DashScope SDK（BailianChatClient）
        url: https://llm-l3buonxbvhgk4qiy.cn-beijing.maas.aliyuncs.com
        api-key: ${DASHSCOPE_API_KEY}
        endpoints:
          chat: /api/v1/services/aigc/multimodal-generation/generation
          embedding: /api/v1/services/embeddings/text-embedding/text-embedding
          # rerank 必须用 OpenAI 兼容端点 /compatible-api/v1/reranks（顶层 model/query/documents/top_n）；
          # 原生端点要求 {input:{query,documents}}，顶层格式会 400
          rerank: /compatible-api/v1/reranks
      deepseek:
        url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY}
        endpoints:
          chat: /chat/completions
      zhipu:
        url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${ZHIPU_API_KEY}
        endpoints:
          chat: /chat/completions
      minimax:
        url: ${MINIMAX_BASE_URL:https://api.minimaxi.com/v1}
        api-key: ${MINIMAX_API_KEY}
        endpoints:
          chat: /v1/text/chatcompletion_v2
    capabilities:
      chat:
        default-model: deepseek-v4-flash
        deep-thinking-model: deepseek-v4-pro
        candidates:
          - id: deepseek-v4-flash
            provider: deepseek
            model: deepseek-v4-flash
            supports-streaming: true
            priority: 1
            # 候选级超时覆盖（全部可选，默认值见设计文档 llm-resilience-optimization WS2）：
            # connect-timeout-ms: 10000        # 连接超时
            # read-timeout-ms: 120000          # 阻塞读超时
            # call-timeout-ms: 150000          # 阻塞调用总时长上限
            # stream-read-timeout-ms: 120000   # 流式相邻 chunk 间隔上限
            # stream-call-timeout-ms: 300000   # 单流总时长上限（0 = 不限）
          - id: qwen3.7-plus
            provider: bailian
            model: qwen3.7-plus
            supports-streaming: true
            priority: 2
          - id: deepseek-v4-pro
            provider: deepseek
            model: deepseek-v4-pro
            supports-streaming: true
            priority: 3
          - id: qwen3.8-max
            provider: bailian
            model: qwen3.8-max
            supports-thinking: true
            priority: 4
      embedding:
        default-model: qwen3.7-text-embedding
        candidates:
          - id: qwen3.7-text-embedding
            provider: bailian
            model: qwen3.7-text-embedding
            dimension: 1536
            # 百炼同步接口单请求行数上限 20（text-embedding-v3/v4 为 10，未声明时客户端默认 10）
            params:
              batch-size: 20
            priority: 1
          - id: text-embedding-v4
            provider: bailian
            model: text-embedding-v4
            dimension: 1536
            priority: 2
      reranking:
        default-model: qwen3-rerank
        candidates:
          - id: qwen3-rerank
            provider: bailian
            model: qwen3-rerank
            priority: 1
    resilience:
      retry:
        max-attempts: 3
        base-delay-ms: 500
        max-delay-ms: 5000
        multiplier: 2.0
      circuit-breaker:
        failure-threshold: 5
        open-duration-ms: 30000
        half-open-max-calls: 2
      probe:
        enabled: true
        probe-timeout-ms: 3000
      # 并发准入闸门（WS4，仅系统候选）。初值未经压测标定，上线走灰度流程：
      # 压测定值 → 单候选灰度（per-candidate params.max-concurrent）→ 盯 llm.busy.rejected（应≈0）→ 全量。
      # 删除本块即禁用（代码默认 max-concurrent=0）。标定约束：各 chat 候选 permit 之和 ≤ boundedElastic 线程数。
      concurrency:
        max-concurrent: 64
        acquire-timeout-ms: 1000
      concurrency-overrides:
        embedding:
          max-concurrent: 16
          acquire-timeout-ms: 5000
        reranking:
          max-concurrent: 8
          acquire-timeout-ms: 5000

  # 通用安全原语（MCP admin 消费）
  security:
    ssrf:
      # SSRF 防护端口白名单；默认 80/443
      allowed-ports: [80, 443]
    crypto:
      # AES/GCM master-key（base64 32B），env 注入，不入 git；MCP Bearer Token 加密使用。
      # 缺失时 MCP Bearer Token 加密运行时失败
      master-key: ${SECURITY_CRYPTO_MASTER_KEY:}

# MCP：DB 是运行时事实源，YAML connections 仅用于首次 bootstrap。
mcp:
  strict-tool-filter: ${MCP_STRICT_TOOL_FILTER:true}
  resilience:
    circuit-breaker:
      failure-threshold: ${MCP_CB_FAILURE_THRESHOLD:5}
      open-duration-ms: ${MCP_CB_OPEN_DURATION_MS:30000}
      half-open-max-calls: ${MCP_CB_HALF_OPEN_MAX_CALLS:2}

# 可观测性：端点仅暴露 health/info/prometheus（业务敏感指标只走 prometheus 抓取）；
# K8s 探针恒暴露 /health/liveness + /health/readiness；
# tracing 仅做本地日志 traceId 串联（不外发 span，全采样无开销），链路明细走 trace_event 表 + AOP
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # 生产默认收紧：未认证不可见 details（含 DB URL/候选配置）；dev 在 profile 中放开
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: smart-rag

# 全局语句超时兜底（秒）；profile 的 mybatis-plus.configuration.* 逐键合并，本值全局生效。
# 若 profile 设 JDBC socketTimeout，必须大于本值：语句先被 MyBatis 干净取消，socket 超时仅兜底
# 挂死连接（base URL 默认 socketTimeout=360 > 300）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 300
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
# Log4j 2 配置见 log4j2.xml，此处不再配置 logging.level
