server:
  port: 8080

spring:
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:your-api-key-here}
      chat:
        enabled: true
        options:
          model: deepseek-chat
          temperature: 0.7

logging:
  level:
    com.demo.deepseekchat: DEBUG
