server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/deepseek_chat
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:your-api-key-here}
      chat:
        model: deepseek-chat
        temperature: 0.7
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

app:
  jwt:
    secret: ${JWT_SECRET:myDefaultSecretKeyForDevOnlyMustBe32CharsLong!!}
    access-expiration: 900
    refresh-expiration: 86400
    issuer: deepseek-chat-demo
    redis-prefix: "auth:token:"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
