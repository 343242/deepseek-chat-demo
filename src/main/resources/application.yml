spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  chat:
    memory:
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}

logging:
  level:
    org.springframework.ai.chat.memory.repository.jdbc.JdbcChatMemoryRepositoryDialect: ERROR
    org.springframework.ai.chat.memory.repository.jdbc.JdbcChatMemoryRepository$Builder: ERROR
