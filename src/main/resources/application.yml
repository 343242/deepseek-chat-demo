spring:
  servlet:
    multipart:
      max-request-size: 55MB
      max-file-size: 55MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    mcp:
      client:
        # SDK 自动初始化保持关闭；连接由 DB 驱动的 MCP bootstrap 逐 Server 隔离初始化。
        enabled: ${MCP_ENABLED:true}
        initialized: ${MCP_INITIALIZED:false}
        type: SYNC
        request-timeout: ${MCP_REQUEST_TIMEOUT:30s}
        # Tavily 远程 MCP（Streamable-HTTP）。Bearer Token 由 Admin API 加密保存并注入 header，
        # 不走 URL query——MCP SDK streamable-http transport 会跑 OAuth 协商层盖过 query param。
        # 未入库工具默认拒绝；需先刷新并由 ADMIN 显式启用。
        streamable-http:
          connections:
            tavily:
              url: https://mcp.tavily.com/mcp

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  chat:
    memory:
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}
    fallback:
      enabled: ${CHAT_FALLBACK_ENABLED:true}
      max-retries: ${CHAT_FALLBACK_MAX_RETRIES:3}
    candidates:
      probe-enabled: false
      probe-timeout-seconds: 10
      probe-cache-enabled: false
      probe-cache-ttl-seconds: 30
      pre-probe-interval-ms: 20000
      # list: populate to activate DynamicModelSelector + ProbeStreamHandler
      # list:
      #   - id: example
      #     provider: provider-name
      #     model: model-name
      #     priority: 1
      #     enabled: true
      #     supports-thinking: false
  rag:
    fts-config: ${RAG_FTS_CONFIG:jiebacfg}
  cag:
    enabled: ${CAG_ENABLED:true}
    inject-prompt: ${CAG_INJECT_PROMPT:true}
    log-context: ${CAG_LOG_CONTEXT:true}
    model-params-cache-ttl-seconds: ${MODEL_PARAMS_CACHE_TTL_SECONDS:30}
    model-params-cache-max-size: ${MODEL_PARAMS_CACHE_MAX_SIZE:200}
    system-prompt-cache-ttl-minutes: ${SYSTEM_PROMPT_CACHE_TTL_MINUTES:5}
    system-prompt-cache-max-size: ${SYSTEM_PROMPT_CACHE_MAX_SIZE:200}
  agent:
    enabled: ${AGENT_ENABLED:true}
    intent-model: ${AGENT_INTENT_MODEL:deepseek-v4-flash}
    intent-temperature: ${AGENT_INTENT_TEMPERATURE:0.1}
    intent-retries: ${AGENT_INTENT_RETRIES:2}
    intent-timeout-ms: ${AGENT_INTENT_TIMEOUT_MS:5000}
    max-tool-iterations: ${AGENT_MAX_TOOL_ITERATIONS:10}
    max-consecutive-same-tool: ${AGENT_MAX_CONSECUTIVE_SAME_TOOL:3}
    context-window-ratio: ${AGENT_CONTEXT_WINDOW_RATIO:0.8}
    tool-timeout-ms: ${AGENT_TOOL_TIMEOUT_MS:10000}
    degrade-on-failure: ${AGENT_DEGRADE_ON_FAILURE:true}
    # Phase 4：ReAct 循环增强 prompt（Self-RAG/DeepRAG 工程化引导）。
    # 直接用检索类 Tool 的意图（RETRIEVAL/DEEP_RETRIEVAL）才引导输出反思标记；DIRECT_ANSWER/GENERAL_TOOL 不引导。
    # 标记由 ReflectionParsingAdvisor 解析落地到 ToolWorkspace + AgentEventStore。
    direct-answer-prompt: |-
      你是一个知识助手。对于当前问题，请直接基于自身知识给出准确、简洁的回答，不需要调用任何工具。
    retrieval-prompt: |-
      你是一个知识助手，需要借助知识库回答用户问题。请按以下流程工作：
      1. 调用合适的检索工具（如 hybridSearch）获取相关文档片段。
      2. 检索后，输出自省标记评估检索结果质量：
         <reflection>
         {"isRelevant": true/false, "isSufficient": true/false, "missingAspects": ["缺少的方面"], "nextAction": "proceed|rewrite_and_search|rerank|switch_tool"}
         </reflection>
         决策规则：相关且足够 → proceed；不相关 → rewrite_and_search；相关但不够且需新检索 → rewrite_and_search；相关但不够且其他工具可补充 → switch_tool。
      3. 当 nextAction=proceed 时，输出中间答案标记记录阶段性结论：
         <intermediate_answer>
         {"subQuery": "子问题原文", "answer": "中间答案内容", "source": "retrieval", "citedDocIds": ["引用的chunkId"]}
         </intermediate_answer>
      4. 基于中间答案生成最终回答，并标注引用来源。
      注意：标记仅用于系统记录，最终回答给用户时不要包含这些标记内容。
    deep-retrieval-prompt: |-
      你是一个知识助手，需要处理复杂问题。请按四步增强循环工作：
      【Step 1 原子决策】先判断当前问题是否需要检索外部知识，输出决策标记：
        <atomic_decision>
        {"subQuery": "问题原文", "decision": "retrieve|parametric", "reason": "决策理由", "fromTool": "可选", "toTool": "可选"}
        </atomic_decision>
        retrieve → 调用检索工具；parametric → 直接用自身知识回答（零检索成本，DeepRAG 实验表明大多数查询可由模型自身知识回答）。
      【Step 2 检索 + 自省】若 retrieve，调用检索工具后输出自省标记：
        <reflection>
        {"isRelevant": true/false, "isSufficient": true/false, "missingAspects": ["缺少的方面"], "nextAction": "proceed|rewrite_and_search|rerank|switch_tool"}
        </reflection>
        决策树：相关且足够 → proceed；不相关 → rewrite_and_search；相关但不够、需新检索 → rewrite_and_search；相关但不够、其他工具可补充 → switch_tool（填 fromTool/toTool）。
      【Step 3 中间答案】当 nextAction=proceed 或 decision=parametric 时，输出中间答案标记：
        <intermediate_answer>
        {"subQuery": "子问题原文", "answer": "中间答案", "source": "retrieval|parametric", "citedDocIds": ["retrieval时填引用chunkId"]}
        </intermediate_answer>
      【Step 4 检索代价感知】每次检索都有成本（延迟 + token），优先使用已有知识和已收集的中间答案；能 rerank 精排解决的不要重新检索；能用自身知识回答的不要调用工具。
      最终基于中间答案生成完整回答并标注引用。注意：标记仅用于系统记录，最终回答不包含标记。
    general-tool-prompt: |-
      你是一个工具助手，请根据用户问题调用合适的工具（如计算器、日期查询等）完成任务，并基于工具返回结果给出清晰回答。
  sandbox:
    enabled: ${SANDBOX_ENABLED:true}
    max-concurrency: ${SANDBOX_MAX_CONCURRENCY:3}
    timeout: ${SANDBOX_TIMEOUT:10s}
    max-memory-mb: ${SANDBOX_MAX_MEMORY_MB:128}
    max-cpus: ${SANDBOX_MAX_CPUS:1.0}
    max-output-bytes: ${SANDBOX_MAX_OUTPUT_BYTES:10240}
    language-images:
      PYTHON: sandbox-python:bookworm
      JAVASCRIPT: sandbox-node:bookworm
      TYPESCRIPT: sandbox-node:bookworm
      JAVA: sandbox-java:bookworm
  messaging:
    topic-prefix: ${MESSAGING_TOPIC_PREFIX:SMART_RAG_}
    shutdown-timeout: ${MESSAGING_SHUTDOWN_TIMEOUT:30s}
    ordered-topics:
      - rag_index_document
    idempotent:
      enabled: ${MESSAGING_IDEMPOTENT_ENABLED:true}
      ttl-seconds: ${MESSAGING_IDEMPOTENT_TTL_SECONDS:90000}
    circuit-breaker:
      failure-threshold: ${MESSAGING_CB_FAILURE_THRESHOLD:5}
      cooldown-millis: ${MESSAGING_CB_COOLDOWN_MILLIS:30000}
    rocketmq:
      endpoints: ${ROCKETMQ_ENDPOINTS:localhost:8081}
      producer-group: ${ROCKETMQ_PRODUCER_GROUP:smart-rag-producer}
      request-timeout: ${ROCKETMQ_REQUEST_TIMEOUT:3s}
      max-delivery-attempts: ${ROCKETMQ_MAX_DELIVERY_ATTEMPTS:16}
      max-message-size: ${ROCKETMQ_MAX_MESSAGE_SIZE:4194304}
  llm:
    byok:
      # BYOK 总开关；基础默认 false（避免未配 master-key 时 fail-fast 阻断启动，P0-3）。
      # 启用：env LLM_BYOK_ENABLED=true 且 SECURITY_CRYPTO_MASTER_KEY=<base64-32B>
      # （v4：env 名从 LLM_MASTER_KEY 改为 SECURITY_CRYPTO_MASTER_KEY，统一管理多模块加密）
      enabled: ${LLM_BYOK_ENABLED:false}

  # v4：通用安全原语（infrastructure/security/），LLM BYOK + MCP admin 共用
  security:
    ssrf:
      # SSRF 防护端口白名单（HostSafetyValidator 用）；默认 80/443
      allowed-ports: [80, 443]
    crypto:
      # AES/GCM master-key（base64 编码 32B = 256-bit），env 注入；不入库不入 git
      # 由 SecretCipher 用，LLM ApiKeyCipher + MCP Bearer Token 共享
      # 缺失时 SecretCipher 不可用，BYOK enabled=true 会 fail-fast，MCP Bearer Token 加密会运行时失败
      master-key: ${SECURITY_CRYPTO_MASTER_KEY:}

# MCP：DB 是运行时事实源，YAML connections 仅用于首次 bootstrap。
mcp:
  strict-tool-filter: ${MCP_STRICT_TOOL_FILTER:true}
  resilience:
    circuit-breaker:
      failure-threshold: ${MCP_CB_FAILURE_THRESHOLD:5}
      open-duration-ms: ${MCP_CB_OPEN_DURATION_MS:30000}
      half-open-max-calls: ${MCP_CB_HALF_OPEN_MAX_CALLS:2}
# Log4j 2 配置见 log4j2.xml，此处不再配置 logging.level
