spring:
  servlet:
    multipart:
      max-request-size: 55MB
      max-file-size: 55MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    mcp:
      client:
        # enabled 默认 true（用户偏好）；initialized 必须 false（design R-8）——
        # 默认 true 会 eager initialize，单个 server 不可达阻塞整个启动；
        # false 让 McpServerRegistryImpl per-client init + try/catch 实现 server 间隔离。
        enabled: ${MCP_ENABLED:true}
        initialized: ${MCP_INITIALIZED:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  chat:
    memory:
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}
    fallback:
      enabled: ${CHAT_FALLBACK_ENABLED:true}
      max-retries: ${CHAT_FALLBACK_MAX_RETRIES:3}
    candidates:
      probe-enabled: false
      probe-timeout-seconds: 10
      probe-cache-enabled: false
      probe-cache-ttl-seconds: 30
      pre-probe-interval-ms: 20000
      # list: populate to activate DynamicModelSelector + ProbeStreamHandler
      # list:
      #   - id: example
      #     provider: provider-name
      #     model: model-name
      #     priority: 1
      #     enabled: true
      #     supports-thinking: false
  rag:
    fts-config: ${RAG_FTS_CONFIG:jiebacfg}
  cag:
    enabled: ${CAG_ENABLED:true}
    inject-prompt: ${CAG_INJECT_PROMPT:true}
    log-context: ${CAG_LOG_CONTEXT:true}
    model-params-cache-ttl-seconds: ${MODEL_PARAMS_CACHE_TTL_SECONDS:30}
    model-params-cache-max-size: ${MODEL_PARAMS_CACHE_MAX_SIZE:200}
    system-prompt-cache-ttl-minutes: ${SYSTEM_PROMPT_CACHE_TTL_MINUTES:5}
    system-prompt-cache-max-size: ${SYSTEM_PROMPT_CACHE_MAX_SIZE:200}
  agent:
    enabled: ${AGENT_ENABLED:true}
    intent-model: ${AGENT_INTENT_MODEL:deepseek-v4-flash}
    intent-temperature: ${AGENT_INTENT_TEMPERATURE:0.1}
    intent-retries: ${AGENT_INTENT_RETRIES:2}
    intent-timeout-ms: ${AGENT_INTENT_TIMEOUT_MS:5000}
    max-tool-iterations: ${AGENT_MAX_TOOL_ITERATIONS:10}
    max-consecutive-same-tool: ${AGENT_MAX_CONSECUTIVE_SAME_TOOL:3}
    context-window-ratio: ${AGENT_CONTEXT_WINDOW_RATIO:0.8}
    tool-timeout-ms: ${AGENT_TOOL_TIMEOUT_MS:10000}
    degrade-on-failure: ${AGENT_DEGRADE_ON_FAILURE:true}
  sandbox:
    enabled: ${SANDBOX_ENABLED:true}
    max-concurrency: ${SANDBOX_MAX_CONCURRENCY:3}
    timeout: ${SANDBOX_TIMEOUT:10s}
    max-memory-mb: ${SANDBOX_MAX_MEMORY_MB:128}
    max-cpus: ${SANDBOX_MAX_CPUS:1.0}
    max-output-bytes: ${SANDBOX_MAX_OUTPUT_BYTES:10240}
    language-images:
      PYTHON: sandbox-python:bookworm
      JAVASCRIPT: sandbox-node:bookworm
      TYPESCRIPT: sandbox-node:bookworm
      JAVA: sandbox-java:bookworm
  messaging:
    topic-prefix: ${MESSAGING_TOPIC_PREFIX:SMART_RAG_}
    shutdown-timeout: ${MESSAGING_SHUTDOWN_TIMEOUT:30s}
    ordered-topics:
      - rag_index_document
    idempotent:
      enabled: ${MESSAGING_IDEMPOTENT_ENABLED:true}
      ttl-seconds: ${MESSAGING_IDEMPOTENT_TTL_SECONDS:90000}
    circuit-breaker:
      failure-threshold: ${MESSAGING_CB_FAILURE_THRESHOLD:5}
      cooldown-millis: ${MESSAGING_CB_COOLDOWN_MILLIS:30000}
    rocketmq:
      endpoints: ${ROCKETMQ_ENDPOINTS:localhost:8081}
      producer-group: ${ROCKETMQ_PRODUCER_GROUP:smart-rag-producer}
      request-timeout: ${ROCKETMQ_REQUEST_TIMEOUT:3s}
      max-delivery-attempts: ${ROCKETMQ_MAX_DELIVERY_ATTEMPTS:16}
      max-message-size: ${ROCKETMQ_MAX_MESSAGE_SIZE:4194304}
  llm:
    byok:
      # BYOK 总开关；基础默认 false（避免未配 LLM_MASTER_KEY 时 fail-fast 阻断启动，P0-3）。
      # 启用：env LLM_BYOK_ENABLED=true 且 LLM_MASTER_KEY=<base64-32B>（design §10 / N4 可回滚）
      enabled: ${LLM_BYOK_ENABLED:false}

# MCP client（Phase 1：模块已就绪，未接 Agent 链；见 .trellis/tasks/06-28-mcp-client-phase1）
mcp:
  policy:
    # DENY（默认）= 显式允许制，空 tools 表 = 全拒（AC4 安全默认）；接 Agent 链前由部署填充 tools。
    default-mode: ${MCP_POLICY_DEFAULT_MODE:DENY}
    tools: {}
  resilience:
    circuit-breaker:
      failure-threshold: ${MCP_CB_FAILURE_THRESHOLD:5}
      open-duration-ms: ${MCP_CB_OPEN_DURATION_MS:30000}
      half-open-max-calls: ${MCP_CB_HALF_OPEN_MAX_CALLS:2}
# Log4j 2 配置见 log4j2.xml，此处不再配置 logging.level
